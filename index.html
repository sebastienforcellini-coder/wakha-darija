<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Wakha Darija — relecture orale</title>
<style>
  :root{
    --ink:#1B2B2A; --clay:#C4552E; --saffron:#E4A11B; --mint:#0F8A7E;
    --deep:#123B47; --sand:#F3EADC; --paper:#FBF6EE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    padding:0 0 120px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px;}
  header{text-align:center;padding:14px 0 8px;}
  h1{font-family:Georgia,serif;font-size:26px;margin:0;letter-spacing:-.01em;}
  .sub{font-size:13px;opacity:.6;margin-top:4px;}
  .bar{height:8px;background:rgba(27,43,42,.12);border-radius:99px;overflow:hidden;margin:16px 0 6px;}
  .fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--saffron));width:0;transition:width .4s;}
  .count{font-size:12px;opacity:.55;text-align:center;letter-spacing:.03em;}
  .card{
    background:var(--paper);border:2px solid var(--ink);border-radius:20px;
    box-shadow:5px 5px 0 var(--mint);padding:22px 20px;margin-top:18px;
  }
  .card.flagged{box-shadow:5px 5px 0 var(--clay);}
  .theme{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;}
  .flagtag{
    display:inline-block;background:var(--clay);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:99px;margin-top:8px;
  }
  .word{font-family:Georgia,serif;font-size:38px;font-weight:700;line-height:1.1;margin:6px 0 2px;}
  .ph{color:var(--clay);font-weight:600;font-size:16px;letter-spacing:.03em;}
  .ar{font-size:26px;opacity:.55;direction:rtl;margin-top:4px;}
  .fr{font-size:17px;opacity:.75;margin-top:8px;}
  .fr b{opacity:1;}
  .rec{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  .micbtn{
    width:100%;border:2px solid var(--ink);border-radius:16px;padding:16px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--deep);color:var(--paper);box-shadow:3px 3px 0 var(--saffron);
    transition:transform .1s;
  }
  .micbtn:active{transform:translate(3px,3px);box-shadow:none;}
  .micbtn.recording{background:var(--clay);box-shadow:3px 3px 0 var(--ink);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
  .dot{width:12px;height:12px;border-radius:50%;background:#fff;}
  .recording .dot{animation:blink .8s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  audio{width:100%;margin-top:4px;}
  .redo{background:none;border:none;color:var(--clay);font-size:13px;font-weight:600;cursor:pointer;padding:4px;text-decoration:underline;font-family:inherit;}
  textarea{
    width:100%;border:2px solid rgba(27,43,42,.25);border-radius:12px;padding:12px;
    font-family:inherit;font-size:15px;resize:vertical;min-height:56px;background:#fff;color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--mint);}
  .verdict{display:flex;gap:8px;margin-top:4px;}
  .vbtn{
    flex:1;border:2px solid var(--ink);border-radius:12px;padding:11px 6px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .vbtn.ok.sel{background:var(--mint);color:#fff;border-color:var(--mint);}
  .vbtn.fix.sel{background:var(--saffron);color:var(--ink);border-color:var(--saffron);}
  .vbtn.del.sel{background:var(--clay);color:#fff;border-color:var(--clay);}
  .nav{
    position:fixed;bottom:0;left:0;right:0;background:var(--paper);
    border-top:2px solid var(--ink);padding:12px 16px;
    display:flex;gap:10px;max-width:560px;margin:0 auto;
  }
  .nav button{
    flex:1;border:2px solid var(--ink);border-radius:14px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    background:var(--paper);color:var(--ink);
  }
  .nav button.primary{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--clay);}
  .nav button:disabled{opacity:.4;}
  .done{text-align:center;padding:40px 0;}
  .done h2{font-family:Georgia,serif;font-size:30px;margin:10px 0;}
  .dl{
    display:inline-block;background:var(--saffron);color:var(--ink);border:2px solid var(--ink);
    border-radius:14px;padding:15px 26px;font-size:16px;font-weight:700;
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;margin-top:10px;
  }
  .listen{color:var(--mint);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;margin-top:8px;}
  .hint{font-size:12px;opacity:.5;text-align:center;margin-top:14px;line-height:1.5;}
</style>
</head>

const state = WORDS.map(w => ({verdict:null, note:"", audio:null, audioURL:null}));
let cur = 0;
let mediaRecorder = null, chunks = [], stream = null;

const $ = id => document.getElementById(id);

function speak(text){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-MA"; u.rate = .8;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function fmtProgress(){
  const done = state.filter(s => s.verdict).length;
  $("fill").style.width = (done/WORDS.length*100) + "%";
  $("count").textContent = done + " / " + WORDS.length + " traités";
}

async function toggleRec(){
  const s = state[cur];
  if(mediaRecorder && mediaRecorder.state === "recording"){
    mediaRecorder.stop();
    return;
  }
  try{
    if(!stream) stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    alert("Micro non autorisé. Sur mobile, la page doit être en HTTPS (lien Vercel), et il faut accepter l'accès au micro.");
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
  mediaRecorder = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
  mediaRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, {type: chunks[0]?.type || "audio/webm"});
    s.audio = blob;
    if(s.audioURL) URL.revokeObjectURL(s.audioURL);
    s.audioURL = URL.createObjectURL(blob);
    if(!s.verdict) s.verdict = "fix";
    render();
  };
  mediaRecorder.start();
  render();
}

function setVerdict(v){ state[cur].verdict = v; fmtProgress(); render(); }
function setNote(v){ state[cur].note = v; }

      <div class="word">${w.d}</div>
      <div class="ph">[ ${w.ph} ]</div>
      <div class="ar">${w.ar}</div>
      <div class="fr"><b>${w.fr}</b></div>
      <button class="listen" onclick="speak(${JSON.stringify(w.ar)})">♪ écouter la version actuelle</button>
      <div class="rec">
        <button class="micbtn ${rec?'recording':''}" onclick="toggleRec()">
          <span class="dot"></span>
          ${rec ? "Enregistrement… touche pour arrêter" : (s.audio ? "Réenregistrer la prononciation" : "Enregistrer la bonne prononciation")}
        </button>
        ${s.audioURL ? `<audio controls src="${s.audioURL}"></audio>` : ``}
        <textarea placeholder="Correction écrite si besoin (mot juste, remarque)…" oninput="setNote(this.value)">${s.note}</textarea>
        <div class="verdict">
          <button class="vbtn ok ${s.verdict==='ok'?'sel':''}" onclick="setVerdict('ok')">✓ OK</button>
          <button class="vbtn fix ${s.verdict==='fix'?'sel':''}" onclick="setVerdict('fix')">✎ À corriger</button>
          <button class="vbtn del ${s.verdict==='del'?'sel':''}" onclick="setVerdict('del')">✕ Retirer</button>
        </div>
      </div>
    </div>
    <div class="hint">Écoute la version actuelle, puis enregistre la bonne à la voix.<br>Verdict « OK » si rien à changer.</div>
  `;
  const nav = $("nav");
  nav.innerHTML = `
    <button onclick="go(-1)" ${cur===0?'disabled':''}>← Précédent</button>
    ${cur===WORDS.length-1
      ? `<button class="primary" onclick="finish()">Terminer ✓</button>`
      : `<button class="primary" onclick="go(1)">Suivant →</button>`}
  `;
  fmtProgress();
}

function go(d){
  if(mediaRecorder && mediaRecorder.state==="recording") mediaRecorder.stop();
  cur = Math.max(0, Math.min(WORDS.length-1, cur+d));
  render();
  window.scrollTo(0,0);
}

async function finish(){
  const done = state.filter(s=>s.verdict).length;
  const withAudio = state.filter(s=>s.audio).length;
  const app = $("app");
  $("nav").style.display = "none";
  app.innerHTML = `<div class="done">
    <h2>Barakallahoufik !</h2>
    <p style="opacity:.65">${done} mots traités, ${withAudio} avec audio.</p>
    <p style="opacity:.65;font-size:14px">Télécharge le dossier de corrections et envoie-le à Séb.</p>
    <button class="dl" onclick="exportAll()">⬇ Télécharger les corrections</button>
    <div class="hint" style="margin-top:24px">Un fichier .zip : un tableau récapitulatif + un enregistrement par mot corrigé.</div>
  </div>`;
}

async function exportAll(){
  // build a summary + bundle audio into a zip (no external lib: minimal zip writer)
  const rows = [["#","Theme","Darija","Phonetique","Arabe","Francais","Verdict","Note","Fichier_audio"]];
  const files = [];
  const vmap = {ok:"OK",fix:"À corriger",del:"À retirer"};
  state.forEach((s,idx)=>{
    const w = WORDS[idx];
    if(!s.verdict && !s.audio && !s.note) return;
    let fname = "";
    if(s.audio){
      const ext = (s.audio.type.includes("mp4")||s.audio.type.includes("aac"))?"m4a":"webm";
      fname = String(w.i).padStart(2,"0")+"_"+w.d.replace(/[^a-zA-Z0-9]/g,"")+"."+ext;
      files.push({name:fname, blob:s.audio});
    }
    rows.push([w.i,w.theme,w.d,w.ph,w.ar,w.fr,vmap[s.verdict]||"",s.note||"",fname]);
  });
  const csv = "\uFEFF"+rows.map(r=>r.map(c=>{
    c=String(c); return /[",;\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
  }).join(";")).join("\r\n");
  files.unshift({name:"corrections.csv", blob:new Blob([csv],{type:"text/csv"})});

  const zipBlob = await makeZip(files);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(zipBlob);
  a.download = "wakha-darija-corrections.zip";
  a.click();
}

// minimal store-only ZIP (no compression, no dependency)
async function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const crcTable = (()=>{ let t=[]; for(let n=0;n<256;n++){let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0;} return t; })();
  function crc32(u8){ let c=0^-1; for(let i=0;i<u8.length;i++) c=(c>>>8)^crcTable[(c^u8[i])&0xFF]; return (c^-1)>>>0; }
  function u32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
  function u16(n){ return new Uint8Array([n&255,(n>>>8)&255]); }
  for(const f of files){
    const nameBytes = enc.encode(f.name);
    const data = new Uint8Array(await f.blob.arrayBuffer());
    const crc = crc32(data);
    const local = concat([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), nameBytes, data
    ]);
    chunks.push(local);
    central.push(concat([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset),
      nameBytes
    ]));
    offset += local.length;
  }
  const cstart = offset;
  let clen = 0; central.forEach(c=>clen+=c.length);
  const end = concat([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(clen), u32(cstart), u16(0)
  ]);
  return new Blob([...chunks, ...central, end], {type:"application/zip"});
  function concat(arrs){
    let len=0; arrs.forEach(a=>len+=a.length);
    const out=new Uint8Array(len); let p=0;
    arrs.forEach(a=>{out.set(a,p);p+=a.length;});
    return out;
  }
}

render();
</script>
